name: watchdog

# Every 3 hours: keeps the search alive (re-enable, re-run failures up to 3 times, restart stuck or missing
# runs), checks the Claude routine is still saving results, checks the dashboard, reports on Telegram.
# Re-enabling both workflows on every run also resets GitHub's 60-day inactivity timer for public repos.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
      TG: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKE }}
      SITE: https://sayaksatpathi.github.io/job-autopilot/
    steps:
      - name: Check and heal search, routine and dashboard
        run: |
          gh workflow enable search.yml || true; gh workflow enable watchdog.yml || true   # keepalive (resets the 60-day inactivity timer)
          STATE=$(GH_TOKEN=$STATE_TOKEN gh api "repos/sayaksatpathi/job-autopilot/contents/state.json?ref=claude/job-state" -q .content 2>/dev/null | base64 -d) || STATE=""
          CHAT=$(echo "$STATE" | jq -r '.kv.telegram_chat // empty' 2>/dev/null)
          PROBLEM=0
          tg() { PROBLEM=1; echo "$1"; if [ -n "$CHAT" ] && [ -n "$TG" ]; then curl -s -X POST "https://api.telegram.org/bot$TG/sendMessage" -d chat_id="$CHAT" --data-urlencode text="$1" > /dev/null; fi; }
          if [ -z "$STATE" ]; then
            echo "cannot read the private state: STATE_TOKEN missing, expired or without access"
            exit 1   # no chat id without state; the Claude routine emails you when the search stops
          fi
          # the keeper (second scheduler) must be running or queued in the day (02-18 UTC); it sleeps at night by design
          gh workflow enable keeper.yml || true
          h=$((10#$(date -u +%H)))
          if [ "$h" -ge 2 ] && [ "$h" -lt 18 ] && [ -z "$(gh run list -w keeper.yml -L 5 --json status -q '.[]|select(.status!="completed")|.status')" ]; then
            gh workflow run keeper.yml && tg "🛠 Watchdog: the backup scheduler had stopped; restarted it."
          fi
          W=search.yml
          # one field per line: an in-progress run has an EMPTY conclusion, which shifted space-separated fields
          { read -r id; read -r status; read -r conclusion; read -r attempt; read -r created; } < <(
            gh run list -w "$W" -L 1 --json databaseId,status,conclusion,attempt,createdAt               -q '.[0] | .databaseId, .status, (if (.conclusion // "") == "" then "none" else .conclusion end), .attempt, .createdAt')
          if [ -z "$created" ]; then age=9999; else age=$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 60 )); fi
          url="https://github.com/$GH_REPO/actions/runs/$id"
          echo "search: $status $conclusion attempt=$attempt age=${age}m"
          if [ "$status" = completed ] && [ "$conclusion" = failure ]; then
            if [ "$attempt" -lt 3 ]; then
              gh run rerun "$id" --failed && tg "🛠 Watchdog: job search failed, re-running it (attempt $((attempt+1))/3). $url"
            else
              tg "🚨 Watchdog: job search failed 3 times. Ask Claude to look at $url"
            fi
          elif [ -n "$id" ] && [ "$status" = in_progress ] && [ "$age" -gt 45 ] && [ "$age" -lt 1440 ]; then
            gh run cancel "$id"; sleep 10; gh workflow run "$W"; tg "🛠 Watchdog: job search was stuck ${age} min; restarted it."
          elif [ "$age" -gt 90 ]; then
            gh workflow run "$W" && tg "🛠 Watchdog: no job search for ${age} min; started one."
          fi
          hb=$(echo "$STATE" | jq -r '.kv.claude_heartbeat // empty')
          if [ -n "$hb" ]; then
            cage=$(( ( $(date -u +%s) - $(date -u -d "$hb" +%s) ) / 60 ))
            echo "claude routine last saved ${cage}m ago"
            h=$((10#$(date -u +%H))); lim=180; { [ "$h" -lt 4 ] || [ "$h" -ge 18 ]; } && lim=720   # the routine runs every 2 h, 08:37-22:37 IST
            if [ "$cage" -gt "$lim" ]; then
              tg "🚨 Watchdog: the Claude routine (sends emails every 2 h, reads replies) has not saved results for ${cage} min. Check https://claude.ai/code/routines"
            fi
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE")
          echo "dashboard: $code"
          if [ "$code" != 200 ]; then tg "🚨 Watchdog: dashboard returned HTTP $code."; fi
          # once a day, the first healthy check after 20:30 IST: an all-clear, so silence in Telegram always means
          # something. Runs drift (cron or keeper), so "first one today after 15:00 UTC" replaces "the 15:xx run".
          if [ "$PROBLEM" = 0 ] && [ $((10#$(date -u +%H))) -ge 15 ]; then
            earlier=$(gh run list -w watchdog.yml -L 30 --json databaseId,createdAt,conclusion \
              -q "[.[] | select(.databaseId != $GITHUB_RUN_ID and .conclusion == \"success\" and .createdAt >= \"$(date -u +%F)T15:00:00Z\")] | length")
            if [ "${earlier:-0}" = 0 ]; then
              LI=$(echo "$STATE" | jq -r '[.li // [] | .[] | .status] | "LinkedIn: \(map(select(.=="draft"))|length) drafts waiting, \(map(select(.=="approved"))|length) approved, \(map(select(.=="posted"))|length) posted"' 2>/dev/null)
              tg "✅ Daily health check: job search, Claude routine and dashboard all OK. $LI. The fixer routine checks every 6 h."
            fi
          fi
# schedule registered 2026-11-20
