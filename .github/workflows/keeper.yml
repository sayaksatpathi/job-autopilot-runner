name: keeper

# Second, independent scheduler. GitHub's cron is best-effort (runs can be delayed or dropped for hours),
# so this job stays alive ~5h50m, starts `search` whenever none ran in the last 35 min and `watchdog`
# whenever none ran in the last 75 min, then starts the next keeper before it exits. Cron restarts the
# keeper if the chain ever breaks, and the watchdog restarts it too: each mechanism revives the other.
# Public repository: Actions minutes are free. A dispatch made with GITHUB_TOKEN is allowed to start runs.
on:
  schedule:
    - cron: "5 2,8,14 * * *"
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TG: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKE }}
    steps:
      - name: Keep search and watchdog running
        run: |
          age() {  # minutes since the latest run of a workflow started (9999 if none)
            t=$(gh run list -w "$1" -L 1 --json createdAt -q '.[0].createdAt' 2>/dev/null)
            [ -n "$t" ] && echo $(( ( $(date -u +%s) - $(date -u -d "$t" +%s) ) / 60 )) || echo 9999
          }
          running() { [ -n "$(gh run list -w search.yml -L 3 --json status -q '.[]|select(.status!="completed")|.status')" ]; }
          end=$(( $(date -u +%s) + 350*60 )); next=0
          while [ "$(date -u +%s)" -lt "$end" ]; do
            # nights off (23:30-07:30 IST): an always-on bot looks like Actions abuse; hourly cron searches still run
            h=$((10#$(date -u +%H))); if [ "$h" -ge 18 ] || [ "$h" -lt 2 ]; then echo "night: keeper sleeps until 07:35 IST"; break; fi
            # a Telegram command is waiting: answer within a minute instead of at the next half-hour run.
            # getUpdates without an offset only peeks; the search run confirms the messages it answers.
            if [ -n "$TG" ] && ! running; then
              n=$(curl -s --max-time 20 "https://api.telegram.org/bot$TG/getUpdates?timeout=0&limit=5" | jq '.result | length' 2>/dev/null)
              if [ "${n:-0}" -gt 0 ]; then gh workflow run search.yml && echo "$(date -u +%H:%M) Telegram message waiting: started search"; sleep 90; fi
            fi
            if [ "$(date -u +%s)" -ge "$next" ]; then
              s=$(age search.yml); w=$(age watchdog.yml)
              echo "$(date -u +%H:%M) search ${s}m ago, watchdog ${w}m ago"
              [ "$s" -gt 35 ] && { gh workflow run search.yml && echo "started search"; }
              [ "$w" -gt 75 ] && { gh workflow run watchdog.yml && echo "started watchdog"; }
              next=$(( $(date -u +%s) + 600 ))
            fi
            sleep 45
          done
      - name: Start the next keeper
        if: always()
        run: |
          h=$((10#$(date -u +%H))); if [ "$h" -ge 18 ] || [ "$h" -lt 2 ]; then echo "night: cron restarts the keeper at 02:05 UTC"; exit 0; fi
          gh workflow run keeper.yml
