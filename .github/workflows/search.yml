name: search

# Public runner: GitHub Actions minutes are unlimited for public repositories. Everything personal (code
# config, resumes, state) stays in the PRIVATE repo, read with the STATE_TOKEN secret. Nothing personal is
# printed to these logs. Only schedule/manual triggers, never pull_request, so forks cannot reach secrets.
on:
  schedule:
    - cron: "22,52 1-18 * * *"   # every 30 min, 06:52-00:52 IST
    - cron: "52 19-23,0 * * *"     # hourly overnight (saves Actions minutes while you sleep)   # every 30 min: Telegram commands and relays; the hunt itself runs once a day after 09:00 IST
  workflow_dispatch:

concurrency:
  group: job-state
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sayaksatpathi/job-autopilot
          token: ${{ secrets.STATE_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: sayaksatpathi/job-autopilot
          ref: claude/job-state
          path: state
          token: ${{ secrets.STATE_TOKEN }}
      - run: |
          git -C state config user.name "job-autopilot"
          git -C state config user.email "job-autopilot@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install (retried: a PyPI hiccup must not fail the run)
        run: for i in 1 2 3; do pip install -q -r requirements.txt && break; [ $i = 3 ] && exit 1; sleep 20; done
      - run: python -m tests.selfcheck > /dev/null
      - name: prepare (retried with fresh state; stderr kept out of this public log)
        run: |
          for i in 1 2 3; do
            python -m autopilot.cloud prepare 2> err.txt && exit 0
            echo "attempt $i failed: $(tail -1 err.txt | cut -c1-160)"
            # usually the Claude routine saved state at the same moment: start again from the newest state
            git -C state fetch -q origin claude/job-state && git -C state reset -q --hard FETCH_HEAD
            sleep $((20 * i))
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKE }}
# schedule registered 2026-11-20
